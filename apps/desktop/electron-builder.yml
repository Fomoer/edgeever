appId: org.edgeever.desktop
productName: EdgeEver
executableName: EdgeEver
publish:
  provider: github
  owner: tianma-if
  repo: edgeever
  releaseType: release
protocols:
  - name: EdgeEver Deep Link
    schemes:
      - edgeever
fileAssociations:
  - ext:
      - md
      - markdown
    name: Markdown document
    description: Open a Markdown document in EdgeEver
    role: Editor
asar: true
beforePack: ./scripts/prepare-backup-worker.cjs
# Cross-platform master (1024). macOS uses the prebuilt full ICNS below so Dock
# always receives ic10/ic14 instead of electron-builder's thin 512-only pack.
icon: assets/icon.png
directories:
  output: ../../release/desktop
files:
  - src/**
  - build/backup-worker.mjs
  - build/zip.js.LICENSE
  - package.json
  # Apply to application code and production dependencies. Keep executable JS,
  # npm commands (including test.js), node-gyp, schemas and license notices.
  - "!**/*.{test,spec}.{js,cjs,mjs,ts,cts,mts}"
  - "!**/{test,tests,__tests__,__mocks__}/**"
  - "!**/*.map"
  - "!**/*.d.{ts,cts,mts}"
  # Zod's standard import/require exports use compiled JS/CJS; src is only
  # selected by its opt-in @zod/source development condition.
  - "!**/node_modules/zod/src/**"
extraResources:
  - from: ../../scripts
    to: mcp-bridge
    filter:
      - edgeever-mcp-stdio.mjs
      - mcp-http-headers.mjs
  - from: ../web/dist
    to: web
    filter:
      - "**/*"
      - "!**/*.map"
  - from: assets
    to: tray
    filter:
      - "trayTemplate.png"
      - "trayTemplate@2x.png"
  - from: assets
    to: .
    filter:
      - "icon.icns"
      - "icon.png"
  - from: ../../migrations
    to: migrations
    filter:
      - "**/*.sql"
  - from: ../../crates/desktop-sidecar/target/release
    to: sidecar
    filter:
      - edgeever-sidecar
      - edgeever-sidecar.exe
mac:
  category: public.app-category.productivity
  icon: assets/icon.icns
  minimumSystemVersion: "13.0"
  # PlugIns are skipped by the default signer, and afterSign runs too late to notarize.
  sign: ./scripts/sign-share-extension.cjs
  extraFiles:
    - from: share-extension/dist/EdgeEverShare.appex
      to: PlugIns/EdgeEverShare.appex
  extendInfo:
    NSScreenCaptureUsageDescription: "EdgeEver captures a screenshot and saves it as a note."
  target:
    - target: dmg
    - target: zip
  artifactName: EdgeEver-${version}-mac-${arch}.${ext}
dmg:
  title: "EdgeEver: double-click to install"
  backgroundColor: '#f5f7f6'
  iconSize: 112
  window:
    width: 720
    height: 480
win:
  target:
    - nsis
  artifactName: EdgeEver-${version}-windows-${arch}.${ext}
nsis:
  oneClick: true
  perMachine: false
  include: nsis/installer.nsh
linux:
  category: Utility
  syncDesktopName: true
  target:
    - AppImage
  artifactName: EdgeEver-${version}-linux-x64.${ext}
